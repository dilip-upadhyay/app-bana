<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AppBana Studio</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif; background:#f5f6f8; color:#222; }
      header { background:#1e293b; color:#fff; padding:10px 16px; display:flex; gap:16px; align-items:center; }
      header a { color:#fff; text-decoration:none; font-size:14px; font-weight:500; }
      header a:hover { text-decoration:underline; }
      main { padding:12px 16px; }
      .spacer { flex:1; }
      .token-box { display:flex; gap:4px; }
      input.token { padding:4px 6px; font-size:12px; width:200px; }
    </style>
    <script>
      // simple top-bar token integration for dev routing
      window.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('topToken');
        const saveBtn = document.getElementById('saveTopToken');
        if (input && saveBtn) {
          input.value = localStorage.getItem('appbana_token') || '';
          saveBtn.addEventListener('click', () => {
            const v = input.value.replace(/[^\x20-\x7E]/g,'').trim();
            if (v) localStorage.setItem('appbana_token', v); else localStorage.removeItem('appbana_token');
          });
        }
      });
    </script>
    <script type="module" crossorigin src="/assets/index-Cup0CoeJ.js"></script>
  </head>
  <body>
    <header>
      <strong>AppBana Studio</strong>
      <a href="/">Home</a>
      <a href="/builder">Builder</a>
      <a href="/explorer">Explorer</a>
      <a href="/app">App Runtime</a>
      <div class="spacer"></div>
      <div class="token-box">
        <input id="topToken" class="token" placeholder="Auth Token" />
        <button id="saveTopToken" style="font-size:12px;">Save</button>
      </div>
    </header>
    <main>
      <app-root></app-root>
    </main>
  </body>
</html>
