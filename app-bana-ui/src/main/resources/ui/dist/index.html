<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AppBana Studio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
  <script>
    (function () {
      const saved = localStorage.getItem('appbana_theme');
      if (saved === 'light') document.documentElement.dataset.theme = 'light';
      if (saved === 'dark') document.documentElement.dataset.theme = 'dark';
    })();
  </script>
  <script type="module" crossorigin src="/assets/index.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/runtime-state-Clmmkiup.js">
  <link rel="modulepreload" crossorigin href="/assets/AppRuntimeShell-kAXBwqIB.js">
  <link rel="modulepreload" crossorigin href="/assets/UnknownElement-BX4m6iDj.js">
  <link rel="stylesheet" crossorigin href="/assets/index-Dm-VKuYO.css">
</head>

<body>
  <div class="app-layout">

    <div class="app-layout-main">
      <header class="app-shell-header">

        <nav>
          <a href="/">Home</a>
          <a href="/builder">Schemas</a>
          <a href="/explorer">Explorer</a>
          <a href="/app">Runtime</a>
          <a href="/studio">Studio</a>
          <a href="/register" style="margin-left:1rem;color:var(--brand);font-weight:600;">Register</a>
          <a href="/login" style="font-weight:600;">Login</a>
        </nav>
        <div class="spacer"></div>
        <div class="flex gap-2" style="align-items:center;">
          <div id="authContainer" style="display:flex; align-items:center; gap:8px;"></div>
          <button id="themeToggle" class="btn small ghost" title="Toggle theme">🌓</button>
        </div>
      </header>
      <main class="app-main">
        <app-root></app-root>
      </main>
    </div>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Theme Logic
      const toggle = document.getElementById('themeToggle');
      toggle?.addEventListener('click', () => {
        const html = document.documentElement;
        const current = html.dataset.theme;
        if (!current) { html.dataset.theme = 'dark'; localStorage.setItem('appbana_theme', 'dark'); return; }
        if (current === 'dark') { html.dataset.theme = 'light'; localStorage.setItem('appbana_theme', 'light'); return; }
        html.dataset.theme = ''; localStorage.removeItem('appbana_theme');
      });

      // 2. Auth Logic
      const authContainer = document.getElementById('authContainer');
      const userJson = localStorage.getItem('appbana_user');
      const token = localStorage.getItem('appbana_token');

      if (userJson && token) {
        try {
          const user = JSON.parse(userJson);
          // Show User Profile
          authContainer.innerHTML = `
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:600; font-size:0.9rem;">👤 ${user.name}</span>
              <button id="logoutBtn" class="btn small outline" style="margin-left:8px;">Logout</button>
            </div>
          `;
          document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('appbana_user');
            localStorage.removeItem('appbana_token');
            window.location.href = '/login';
          });

          // Hide Login/Register links if logged in
          const nav = document.querySelector('nav');
          const loginLink = nav.querySelector('a[href="/login"]');
          const regLink = nav.querySelector('a[href="/register"]');
          if (loginLink) loginLink.style.display = 'none';
          if (regLink) regLink.style.display = 'none';

        } catch (e) {
          console.error('Invalid user data', e);
          localStorage.removeItem('appbana_user'); // cleanup
        }
      } else {
        // Show Token Input (Legacy/Dev mode)
        authContainer.innerHTML = `
           <input id="topToken" class="input" placeholder="Auth Token" style="width:180px;" />
           <button id="saveTopToken" class="btn small outline" title="Save auth token">Save</button>
        `;
        const input = document.getElementById('topToken');
        const saveBtn = document.getElementById('saveTopToken');
        if (input && saveBtn) {
          input.value = localStorage.getItem('appbana_token') || '';
          saveBtn.addEventListener('click', () => {
            const v = input.value.replace(/[^\x20-\x7E]/g, '').trim();
            if (v) localStorage.setItem('appbana_token', v); else localStorage.removeItem('appbana_token');
            window.location.reload(); // Reload to apply changes
          });
        }
      }
    });
  </script>
</body>

</html>
