name: CI

# Review #10 (8250e30 close-out): this used to trigger only on main/master, so
# ~10 rounds and ~20 defects across the feature branch this project actually
# develops on went through CI exactly zero times before merge. Now runs on
# every branch, both on push and on any PR (whatever its target).
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    # The Java test suites talk to a real PostgreSQL on localhost:5432 using the
    # credentials in the repo's config.json. Liquibase migrations run on server
    # start-up, so an empty database is all that is required.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: appbana
          POSTGRES_USER: appbana
          POSTGRES_PASSWORD: appbana_dev_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appbana -d appbana"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      - name: Upload fat JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-bana-fat-jars
          path: '**/target/*-fat.jar'

  frontend:
    runs-on: ubuntu-latest

    # No backend/DB involved — @appbana/shared, app-bana-studio and
    # app-bana-runtime are pure type-check/build/unit-test surfaces. This does
    # NOT cover the Playwright e2e suite in e2e/, which needs the full stack
    # (Postgres, Qdrant, ai-builder, backend, Studio, Runtime) running plus an
    # OPENAI_API_KEY — tracked as a separate follow-up, not attempted here.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check @appbana/shared
        run: pnpm --filter @appbana/shared build

      - name: Type-check + build app-bana-studio
        run: pnpm --filter app-bana-studio build

      - name: Runtime unit tests (vitest)
        run: pnpm --filter @appbana/runtime test

      - name: Type-check + build app-bana-runtime
        run: pnpm --filter @appbana/runtime build
