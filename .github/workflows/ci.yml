name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      - name: Upload fat JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-bana-fat-jars
          path: '**/target/*-fat.jar'
