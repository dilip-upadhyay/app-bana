<!DOCTYPE html>
<html>
<head>
    <title>Configure Datasource</title>
    <meta charset="UTF-8">
    <style>
        table { border-collapse: collapse; margin-top: 16px; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; }
        .active { color: green; font-weight: bold; }
        .muted { color: #666; }
        button.small { padding: 4px 8px; margin-right: 4px; }
        label { display: inline-block; width: 220px; vertical-align: top; }
        input, select { width: 360px; }
        .hint { font-size: 12px; color: #666; }
        .section { margin-top: 16px; padding-top: 8px; border-top: 1px dashed #ccc; }
    </style>
</head>
<body>
    <h2>Datasource Configuration</h2>

    <div>
        <h3>Add or Update</h3>
        <form id="dsForm" method="post" action="/ui/datasource/save">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="default" required><br><br>

            <label for="type">Type:</label>
            <select id="type" name="type">
                <option value="h2">H2</option>
                <option value="postgres">PostgreSQL</option>
                <option value="mysql">MySQL</option>
                <option value="mariadb">MariaDB</option>
                <option value="mssql">SQL Server</option>
                <option value="oracle">Oracle</option>
                <option value="sqlite">SQLite</option>
                <option value="custom">Custom</option>
            </select><br><br>

            <label for="url">JDBC URL:</label>
            <input type="text" id="url" name="url" required placeholder="jdbc:h2:./data/appbana;AUTO_SERVER=TRUE"><br><br>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="(unchanged)"><br><br>

            <label for="driver">Driver Class Name:</label>
            <input type="text" id="driver" name="driver" placeholder="org.h2.Driver"><br><br>

            <div class="section">
                <strong>Connection Pool (optional)</strong>
                <div class="hint">Only set fields you want to override; others use sensible defaults.</div><br>
                <label for="maxPoolSize">Max Pool Size:</label>
                <input type="number" id="maxPoolSize" name="maxPoolSize" min="1" placeholder="10"><br><br>

                <label for="minIdle">Min Idle:</label>
                <input type="number" id="minIdle" name="minIdle" min="0" placeholder="2"><br><br>

                <label for="connectionTimeoutMs">Connection Timeout (ms):</label>
                <input type="number" id="connectionTimeoutMs" name="connectionTimeoutMs" min="100" step="100" placeholder="30000"><br><br>

                <label for="idleTimeoutMs">Idle Timeout (ms):</label>
                <input type="number" id="idleTimeoutMs" name="idleTimeoutMs" min="0" step="1000" placeholder="600000"><br><br>

                <label for="maxLifetimeMs">Max Lifetime (ms):</label>
                <input type="number" id="maxLifetimeMs" name="maxLifetimeMs" min="0" step="1000" placeholder="1800000"><br><br>

                <label for="autoCommit">Auto-commit:</label>
                <input type="checkbox" id="autoCommit" name="autoCommit" checked>
                <span class="hint">Checked = true</span><br><br>

                <label for="poolName">Pool Name:</label>
                <input type="text" id="poolName" name="poolName" placeholder="appbana-<name>"><br><br>
            </div>

            <button type="submit">Save</button>
        </form>
        <div id="result" class="muted"></div>
    </div>

    <div>
        <h3>Datasources</h3>
        <div id="dsList">Loading...</div>
    </div>

    <script>
    function h(text) { return String(text==null?'':text); }

    const defaults = {
        h2: { driver: 'org.h2.Driver', url: 'jdbc:h2:./data/appbana;AUTO_SERVER=TRUE' },
        postgres: { driver: 'org.postgresql.Driver', url: 'jdbc:postgresql://localhost:5432/dbname' },
        mysql: { driver: 'com.mysql.cj.jdbc.Driver', url: 'jdbc:mysql://localhost:3306/dbname' },
        mariadb: { driver: 'org.mariadb.jdbc.Driver', url: 'jdbc:mariadb://localhost:3306/dbname' },
        mssql: { driver: 'com.microsoft.sqlserver.jdbc.SQLServerDriver', url: 'jdbc:sqlserver://localhost:1433;databaseName=dbname' },
        oracle: { driver: 'oracle.jdbc.OracleDriver', url: 'jdbc:oracle:thin:@localhost:1521:orcl' },
        sqlite: { driver: 'org.sqlite.JDBC', url: 'jdbc:sqlite:/path/to/file.db' }
    };

    function applyTypeHints(type, {forceDriver=false, forceUrl=false} = {}) {
        const t = (type||'').toLowerCase();
        const d = defaults[t];
        const driverEl = document.getElementById('driver');
        const urlEl = document.getElementById('url');
        if (d) {
            driverEl.placeholder = d.driver;
            urlEl.placeholder = d.url;
            if (forceDriver || !driverEl.value) driverEl.value = d.driver;
            if (forceUrl || !urlEl.value) urlEl.value = d.url;
        } else {
            driverEl.placeholder = '';
            urlEl.placeholder = '';
        }
    }

    document.getElementById('type').addEventListener('change', (e) => applyTypeHints(e.target.value));

    async function prefill() {
        try {
            const resp = await fetch('/ui/datasource/config');
            if (!resp.ok) return;
            const cfg = await resp.json();
            const type = cfg.type || inferTypeFromUrl(cfg.jdbcUrl) || 'h2';
            document.getElementById('type').value = ['h2','postgres','mysql','mariadb','mssql','oracle','sqlite'].includes(type) ? type : 'custom';
            applyTypeHints(document.getElementById('type').value);
            document.getElementById('name').value = cfg.name || '';
            document.getElementById('url').value = cfg.jdbcUrl || '';
            document.getElementById('username').value = cfg.username || '';
            document.getElementById('driver').value = cfg.driver || document.getElementById('driver').value;
            // pool
            setNum('maxPoolSize', cfg.maxPoolSize);
            setNum('minIdle', cfg.minIdle);
            setNum('connectionTimeoutMs', cfg.connectionTimeoutMs);
            setNum('idleTimeoutMs', cfg.idleTimeoutMs);
            setNum('maxLifetimeMs', cfg.maxLifetimeMs);
            document.getElementById('autoCommit').checked = cfg.autoCommit == null ? true : !!cfg.autoCommit;
            document.getElementById('poolName').value = cfg.poolName || '';
        } catch (e) { /* ignore */ }
    }

    function setNum(id, v) { const el = document.getElementById(id); el.value = (v==null? '': v); }

    function inferTypeFromUrl(url) {
        if (!url) return null;
        if (url.startsWith('jdbc:h2:')) return 'h2';
        if (url.startsWith('jdbc:postgresql:')) return 'postgres';
        if (url.startsWith('jdbc:mysql:')) return 'mysql';
        if (url.startsWith('jdbc:mariadb:')) return 'mariadb';
        if (url.startsWith('jdbc:sqlserver:')) return 'mssql';
        if (url.startsWith('jdbc:oracle:')) return 'oracle';
        if (url.startsWith('jdbc:sqlite:')) return 'sqlite';
        return null;
    }

    async function loadList() {
        const el = document.getElementById('dsList');
        try {
            const resp = await fetch('/ui/datasource/list');
            if (!resp.ok) { el.textContent = 'Failed to load datasources'; return; }
            const list = await resp.json();
            if (!Array.isArray(list) || list.length === 0) { el.textContent = 'No datasources yet.'; return; }
            let html = '<table><thead><tr><th>Active</th><th>Name</th><th>Type</th><th>URL</th><th>User</th><th>Driver</th><th>Actions</th></tr></thead><tbody>';
            for (const d of list) {
                html += '<tr>' +
                    '<td>' + (d.active ? '<span class="active">●</span>' : '') + '</td>' +
                    '<td>' + h(d.name) + '</td>' +
                    '<td>' + h(d.type||'') + '</td>' +
                    '<td class="muted">' + h(d.jdbcUrl) + '</td>' +
                    '<td>' + h(d.username) + '</td>' +
                    '<td>' + h(d.driver) + '</td>' +
                    '<td>' +
                    '<button class="small" onclick="loadIntoForm(\'' + encodeURIComponent(d.name) + '\')">Load</button>' +
                    '<button class="small" onclick="activateDs(\'' + encodeURIComponent(d.name) + '\')">Activate</button>' +
                    '<button class="small" onclick="deleteDs(\'' + encodeURIComponent(d.name) + '\')">Delete</button>' +
                    '</td>' +
                    '</tr>';
            }
            html += '</tbody></table>';
            el.innerHTML = html;
        } catch (e) {
            el.textContent = 'Error loading datasources: ' + e;
        }
    }

    async function loadIntoForm(name) {
        try {
            const resp = await fetch('/ui/datasource/list');
            const list = await resp.json();
            const dec = decodeURIComponent(name);
            const d = list.find(x => x.name === dec);
            if (d) {
                const type = d.type || inferTypeFromUrl(d.jdbcUrl) || 'custom';
                const tsel = document.getElementById('type');
                tsel.value = ['h2','postgres','mysql','mariadb','mssql','oracle','sqlite'].includes(type) ? type : 'custom';
                applyTypeHints(tsel.value);
                document.getElementById('name').value = d.name || '';
                document.getElementById('url').value = d.jdbcUrl || '';
                document.getElementById('username').value = d.username || '';
                document.getElementById('driver').value = d.driver || document.getElementById('driver').value;
                document.getElementById('password').value = '';
                // pool
                setNum('maxPoolSize', d.maxPoolSize);
                setNum('minIdle', d.minIdle);
                setNum('connectionTimeoutMs', d.connectionTimeoutMs);
                setNum('idleTimeoutMs', d.idleTimeoutMs);
                setNum('maxLifetimeMs', d.maxLifetimeMs);
                document.getElementById('autoCommit').checked = d.autoCommit == null ? true : !!d.autoCommit;
                document.getElementById('poolName').value = d.poolName || '';
                document.getElementById('result').textContent = 'Loaded ' + d.name + ' into form.';
            }
        } catch (e) {}
    }

    async function activateDs(name) {
        const dec = decodeURIComponent(name);
        const resp = await fetch('/ui/datasource/activate', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: dec})
        });
        const msg = await resp.text();
        document.getElementById('result').textContent = msg;
        await loadList();
    }

    async function deleteDs(name) {
        const dec = decodeURIComponent(name);
        if (!confirm('Delete datasource "' + dec + '"?')) return;
        const resp = await fetch('/ui/datasource/delete', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: dec})
        });
        const msg = await resp.text();
        document.getElementById('result').textContent = msg;
        await loadList();
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await prefill();
        await loadList();
    });

    document.getElementById('dsForm').onsubmit = async function(e) {
        e.preventDefault();
        const form = e.target;
        const data = {
            name: form.name.value,
            type: form.type.value === 'custom' ? undefined : form.type.value,
            url: form.url.value,
            username: form.username.value || undefined,
            password: form.password.value || undefined,
            driver: form.driver.value || undefined,
            // pool (omit blanks)
            maxPoolSize: toNum(form.maxPoolSize.value),
            minIdle: toNum(form.minIdle.value),
            connectionTimeoutMs: toNum(form.connectionTimeoutMs.value),
            idleTimeoutMs: toNum(form.idleTimeoutMs.value),
            maxLifetimeMs: toNum(form.maxLifetimeMs.value),
            autoCommit: form.autoCommit.checked,
            poolName: form.poolName.value || undefined
        };
        const resp = await fetch('/ui/datasource/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await resp.text();
        document.getElementById('result').innerText = result;
        form.password.value = '';
        await loadList();
    };

    function toNum(v){ if (v==null || v==='') return undefined; const n=Number(v); return Number.isNaN(n)? undefined : n; }
    </script>
</body>
</html>
