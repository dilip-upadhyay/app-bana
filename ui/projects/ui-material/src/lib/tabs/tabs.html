<mat-tab-group [selectedIndex]="selectedIndex" (selectedIndexChange)="selectedIndexChange.emit($event)">
  <mat-tab *ngFor="let t of tabs" [label]="t.label">
    <ng-container *ngIf="t.content; else projected">
      {{ t.content }}
    </ng-container>
    <ng-template #projected>
      <ng-content></ng-content>
    </ng-template>
  </mat-tab>
</mat-tab-group>
